name: Screenshots

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Format
        run: ./gradlew spotlessApply

      - name: Render Context and Loops screens
        run: ./gradlew :screenshotTests:updateScreenshots

      - name: Auto-commit if changed
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting or screenshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-fix: spotlessApply and updateScreenshots [skip ci]"
          # Release tags (and other pushes) often land while screenshots render.
          # Rebase + retry so we don't fail the job on a non-fast-forward.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "Pushed screenshot updates"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push screenshot updates after retries"
          exit 1
