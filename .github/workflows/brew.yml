name: Homebrew Cask

on:
  push:
    paths:
      - 'brew/**'
  pull_request:
    paths:
      - 'brew/**'
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

jobs:
  validate:
    name: Validate cask
    if: github.event_name != 'workflow_run'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Ruby syntax
        run: ruby -c brew/orcaeye.rb

      - name: Lint cask
        run: |
          # brew style only applies the cask rules when the file sits in a Casks/ dir.
          mkdir -p /tmp/tap-style/Casks
          cp brew/orcaeye.rb /tmp/tap-style/Casks/orcaeye.rb
          brew style /tmp/tap-style/Casks/orcaeye.rb

  publish:
    name: Publish to tap
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Get version from release tag
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Triggering run was not a release tag (got '${TAG}')"
            exit 1
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download DMGs from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v${VERSION}" --dir dist \
            --pattern "Orcaeye-${VERSION}-macos-arm64.dmg" \
            --pattern "Orcaeye-${VERSION}-macos-x64.dmg"

      - name: Update cask version and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA_ARM=$(sha256sum "dist/Orcaeye-${VERSION}-macos-arm64.dmg" | cut -d' ' -f1)
          SHA_X64=$(sha256sum "dist/Orcaeye-${VERSION}-macos-x64.dmg" | cut -d' ' -f1)

          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" brew/orcaeye.rb
          sed -i -E "s|(arm:[[:space:]]+)\"[a-f0-9]{64}\"|\1\"${SHA_ARM}\"|" brew/orcaeye.rb
          sed -i -E "s|(intel:[[:space:]]+)\"[a-f0-9]{64}\"|\1\"${SHA_X64}\"|" brew/orcaeye.rb

          echo "Updated to ${VERSION} (arm64 ${SHA_ARM}, x64 ${SHA_X64})"
          cat brew/orcaeye.rb

      - name: Push cask to SimonSchubert/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set"
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/SimonSchubert/homebrew-tap.git" /tmp/tap
          cp brew/orcaeye.rb /tmp/tap/Casks/orcaeye.rb

          cd /tmp/tap
          git add Casks/orcaeye.rb
          git diff --cached --quiet && echo "Cask already up to date" && exit 0
          git commit -m "orcaeye ${VERSION}"
          git push

      - name: Commit updated cask back to this repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brew/orcaeye.rb
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update Homebrew cask to ${VERSION} [skip ci]"
          git push
